# moviecreator 전역 설정 (경로는 저장소 루트 기준)

[paths]
models_raw = "models/raw"
wan_model  = "models/mlx/wan22_ti2v5b_q8"
rife_dir   = "tools/rife"
projects   = "projects"
logs       = "logs"

[video]
# Wan2.2 TI2V-5B: 24fps, 프레임 = 4n+1, 가로·세로 32의 배수, 최대 121프레임(약 5초)
native_fps = 24
max_frames = 121
min_frames = 17
extra_seconds = 1           # 컷 길이 + 1초를 생성해 편집 여유 확보
cooldown_seconds = 10
min_free_memory_pct = 20
# 시간 추정 기준: M5 24GB에서 480x864·49프레임 1스텝 ≈ 13.5초 (실측)
ref_tokens = 21060
ref_step_seconds = 13.5
ref_fixed_seconds = 190     # 텍스트 인코딩 + VAE 디코딩(기준 크기)

# 생성 품질: 해상도는 아래 비율별 표에서, 스텝은 여기서
[quality.draft]
label = "시안"
steps = 20
frames = 49                 # 2초 고정 (구도·움직임 확인용)

[quality.standard]
label = "표준"
steps = 25

[quality.final]
label = "고화질"
steps = 30

# 비율별 생성 해상도 [가로, 세로] 와 최종 출력 해상도
[aspect."9:16"]
label = "세로 9:16 (릴스·쇼츠)"
draft = [480, 864]
standard = [544, 960]
final = [704, 1280]
output = [1080, 1920]

[aspect."16:9"]
label = "가로 16:9 (유튜브)"
draft = [864, 480]
standard = [960, 544]
final = [1280, 704]
output = [1920, 1080]

[aspect."1:1"]
label = "정사각 1:1 (피드)"
draft = [640, 640]
standard = [736, 736]
final = [960, 960]
output = [1080, 1080]

[keyframe]
command = "mflux-generate"
model = "schnell"           # Apache 2.0 (상업 이용 가능)
quantize = 8
steps = 4

[output]
fps = 30
crf = 16
preset = "slow"
sharpen = "unsharp=5:5:0.4"
rife_model = "rife-v4.6"
audio_loudness = -14

# 최종 색감 (컷 정규화 시 적용)
[grade]
none = ""
warm = "colorbalance=rs=0.05:bs=-0.05:rm=0.03:bm=-0.03,eq=saturation=1.05"
cool = "colorbalance=rs=-0.04:bs=0.05:rm=-0.03:bm=0.04"
film = "curves=preset=medium_contrast,eq=saturation=0.9,vignette=PI/5"
vivid = "eq=saturation=1.2:contrast=1.05"
bw = "hue=s=0,curves=preset=medium_contrast"
